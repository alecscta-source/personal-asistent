name: Deploy Bianca

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bianca-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS credentials
        id: preflight
        shell: bash
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VPS deployment skipped: VPS_USER and/or VPS_SSH_KEY are not configured yet."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS
        if: steps.preflight.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 185.246.122.152
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            APP_DIR=/opt/personal-asistent
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone https://github.com/alecscta-source/personal-asistent.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            cat > .env <<'EOF'
            VITE_SUPABASE_URL=https://qhremmecmiilsppjnjnc.supabase.co
            VITE_SUPABASE_ANON_KEY=sb_publishable_LjodWbNN4jLidMUiGdD67g_wKSLGt3O
            EOF
            docker compose up -d --build --remove-orphans
            docker image prune -f
            curl -fsS http://127.0.0.1:4173/health
